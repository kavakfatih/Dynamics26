name: Alpha4 one-shot solve-state fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/__alpha4_fix_solve_state.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact solve-state signal connection
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("gui/shell/Dynamics26MainWindow.cpp"); t=p.read_text(); old="    connect(analysis_, &AnalysisService::solveStateChanged, this, [this](const bool solving) {\n        solving_ = solving;\n        engineeringStatus_->setSolverState(solving ? SolverState::Solving : SolverState::Idle);\n    });"; new="    connect(analysis_, &AnalysisService::solveStateChanged, this,\n            [this](const ObjectId analysisId, const SolveState state) {\n                // AnalysisService signal i (ObjectId, SolveState) tasir. ObjectId yi\n                // bool gibi yorumlamak gecerli her analiz kimliginde UI yi sonsuza\n                // kadar solving durumunda birakir ve Solve komutunu kilitlerdi.\n                // Yalniz aktif analizin lifecycle state i global shell durumunu etkiler.\n                if (analysisId != activeAnalysis()) {\n                    return;\n                }\n                solving_ = state == SolveState::Preflight || state == SolveState::Solving;\n                syncCommandStates();\n                syncStatusBar();\n            });"; assert t.count(old)==1, f"exact block count={t.count(old)}"; p.write_text(t.replace(old,new,1))'
          git diff --check
          git diff -- gui/shell/Dynamics26MainWindow.cpp
      - name: Commit fix directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dynamics26 CI"
          git config user.email "actions@users.noreply.github.com"
          git add gui/shell/Dynamics26MainWindow.cpp
          git commit -m "fix: honor analysis solve state signal contract"
          git push origin HEAD:main
