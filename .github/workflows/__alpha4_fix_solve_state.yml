name: Alpha4 one-shot solve-state fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/__alpha4_fix_solve_state.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact solve-state signal connection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gui/shell/Dynamics26MainWindow.cpp')
          text = path.read_text()
          old = '''    connect(analysis_, &AnalysisService::solveStateChanged, this, [this](const bool solving) {
        solving_ = solving;
        engineeringStatus_->setSolverState(solving ? SolverState::Solving : SolverState::Idle);
    });'''
          new = '''    connect(analysis_, &AnalysisService::solveStateChanged, this,
            [this](const ObjectId analysisId, const SolveState state) {
                // AnalysisService signal'i (ObjectId, SolveState) taşır. ObjectId'yi
                // bool gibi yorumlamak geçerli her analiz kimliğinde UI'yi sonsuza
                // kadar "solving" durumunda bırakır ve Solve komutunu kilitlerdi.
                // Yalnız aktif analizin lifecycle state'i global shell durumunu etkiler.
                if (analysisId != activeAnalysis()) {
                    return;
                }
                solving_ = state == SolveState::Preflight || state == SolveState::Solving;
                syncCommandStates();
                syncStatusBar();
            });'''
          if text.count(old) != 1:
              raise SystemExit(f'exact solve-state block count={text.count(old)}; expected 1')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- gui/shell/Dynamics26MainWindow.cpp
      - name: Commit fix directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dynamics26 CI"
          git config user.email "actions@users.noreply.github.com"
          git add gui/shell/Dynamics26MainWindow.cpp
          git commit -m "fix: honor analysis solve state signal contract"
          git push origin HEAD:main
