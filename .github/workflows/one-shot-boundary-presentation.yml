name: One-shot boundary presentation patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-boundary-presentation.yml

permissions:
  contents: write

jobs:
  patch-mainwindow:
    runs-on: macos-15
    env:
      PATCH_SCRIPT_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact persistent-scope presentation patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode | python3
          git diff --check
          git diff --stat -- gui/shell/Dynamics26MainWindow.cpp
          test "$(git diff --name-only | grep -v '^\.github/workflows/one-shot-boundary-presentation.yml$' | sort -u)" = "gui/shell/Dynamics26MainWindow.cpp"

      - name: Commit exact patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dynamics26 CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-boundary-presentation.yml
          git add gui/shell/Dynamics26MainWindow.cpp
          git diff --cached --check
          git commit -m "fix: resolve boundary presentation from persistent scope"
          git push origin HEAD:main
