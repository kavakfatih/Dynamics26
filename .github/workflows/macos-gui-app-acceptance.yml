name: macOS GUI application acceptance

"on":
  push:
    branches: [main]
    # Application-level acceptance yalnız integrated selection / Preflight /
    # analysis workflow yüzeyi değiştiğinde çalışır. Trusted Mac fast gate ana
    # günlük yol olarak kalırken hosted Apple Silicon runner Debug + Release
    # davranış farklarının sessiz regresyon üretmesini engeller. Engineering
    # Inspector primitive/binding ve GUI milestone/CMake composition değişiklikleri
    # de aynı gerçek application selftest'i yeniden çalıştırmalıdır.
    paths:
      - ".github/workflows/macos-gui-app-acceptance.yml"
      - "gui/CMakeLists.txt"
      - "gui/main.cpp"
      - "gui/shell/Dynamics26MainWindow.*"
      - "gui/shell/SelectionCoordinator.*"
      - "gui/shell/UtilityWorkspace.*"
      - "gui/support/SelectionAcceptanceTest.h"
      - "gui/support/MaterialInspectorAcceptance.h"
      - "gui/support/MeshInspectorAcceptance.h"
      - "gui/support/AnalysisInspectorAcceptance.h"
      - "gui/support/InspectorUxAcceptance.h"
      - "gui/support/SolverWorkspaceAccessibilityAcceptance.h"
      - "gui/support/SolverWorkspaceAcceptance.h"
      - "gui/support/SolverDiagnosticsAcceptance.h"
      - "gui/support/SolverCoupledDiagnosticsAcceptance.h"
      - "gui/support/BoundaryConsumerAcceptance.h"
      - "gui/support/BoundarySelectionAuthoringAcceptance.h"
      - "gui/support/PreflightAcceptance.h"
      - "gui/support/IntegratedWorkflowAcceptance.h"
      - "gui/support/ContactPreflightAcceptance.h"
      - "gui/support/ContactPersistenceAcceptance.h"
      - "gui/support/ContactShellAcceptance.h"
      - "gui/support/ContactInspectorAcceptance.h"
      - "gui/core/ScopeSelectionBridge.h"
      - "gui/core/ScopeReferenceBuilder.h"
      - "gui/core/AnalysisCapability.*"
      - "gui/core/SelectionManager.*"
      - "gui/services/NamedSelectionService.*"
      - "gui/services/ContactService.*"
      - "gui/services/AnalysisBoundaryScope.cpp"
      - "gui/services/AnalysisService.*"
      - "gui/services/MaterialService.*"
      - "gui/details/DetailsPage.*"
      - "gui/details/ObjectDetails.*"
      - "gui/details/MaterialDetails.*"
      - "gui/details/MeshDetails.*"
      - "gui/details/AnalysisDetails.*"
      - "gui/details/BoundaryConditionDetails.*"
      - "gui/details/ResultDetails.*"
      - "gui/details/ConnectionsDetails.h"
      - "gui/details/ContactDetails.h"
      - "gui/commands/NamedSelectionCommands.h"
      - "gui/commands/ContactCommands.h"
      - "gui/commands/DomainCommands.*"
      - "tests/gui/test_named_selection.cpp"
      - "tests/gui/test_contact_service.cpp"
      - "tests/gui/test_contact_commands.cpp"
      - "tests/gui/test_analysis_capability.cpp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-selftest:
    name: hosted application selftest (${{ matrix.build_type }})
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      BUILD_DIR: build-hosted-app-${{ matrix.build_type }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Verify Apple Silicon source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "arm64"
          git diff --check

      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install qt vtk arpack opencascade

      - name: Configure GUI application
        shell: bash
        env:
          FC: gfortran-15
        run: |
          set -euxo pipefail
          prefix_path="$(brew --prefix qt);$(brew --prefix vtk);$(brew --prefix opencascade)"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$prefix_path" \
            -DFEMCAE_BUILD_TESTING=ON \
            -DFEMCAE_BUILD_GUI=ON \
            -DFEMCAE_GUI_WITH_VTK=ON \
            -DFEMCAE_ENABLE_OCCT_GEOMETRY=ON \
            -DFEMCAE_REQUIRE_OCCT=ON

      - name: Build application
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "$BUILD_DIR" --parallel --target femcae_gui
          cmake --build "$BUILD_DIR" --parallel --target femcae_analysis_capability_test

      - name: Run typed capability resolver gate
        shell: bash
        run: ctest --test-dir "$BUILD_DIR" -R '^gui.analysis_capability$' --output-on-failure

      - name: Run integrated application acceptance
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -uo pipefail
          app="$BUILD_DIR/gui/FEMCAE.app/Contents/MacOS/FEMCAE"
          test -x "$app"
          set +e
          output="$($app --selection-selftest 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0
          grep -q "selection shell acceptance PASS" <<< "$output"
          grep -q "Material Inspector acceptance: 26/26 PASS" <<< "$output"
          grep -q "Mesh Inspector acceptance PASS" <<< "$output"
          grep -q "Analysis Inspector acceptance PASS" <<< "$output"
          grep -q "Inspector UX consistency acceptance PASS" <<< "$output"
          grep -q "Solver workspace accessibility acceptance: 13/13 PASS" <<< "$output"
          grep -q "Solver workspace acceptance: 54/54 PASS" <<< "$output"
          grep -q "Solver diagnostics acceptance: 25/25 PASS" <<< "$output"
          grep -q "Coupled diagnostics acceptance: 15/15 PASS" <<< "$output"
          grep -q "Boundary consumer acceptance PASS" <<< "$output"
          grep -q "B3.1 boundary selection authoring acceptance PASS" <<< "$output"
          grep -q "Alpha.4 Preflight acceptance PASS" <<< "$output"
          grep -q "Alpha.4 Integrated workflow acceptance PASS" <<< "$output"
          grep -q "Contact Preflight safety acceptance PASS" <<< "$output"
          grep -q "Contact project persistence acceptance PASS" <<< "$output"
          grep -q "Contact shell mutation acceptance PASS" <<< "$output"
          grep -q "Contact Inspector authoring acceptance PASS" <<< "$output"

      - name: Verify native arm64 app
        shell: bash
        run: |
          set -euxo pipefail
          app="$BUILD_DIR/gui/FEMCAE.app/Contents/MacOS/FEMCAE"
          file -L "$app" | tee "/tmp/dynamics26-hosted-app-${BUILD_TYPE}-arch.txt"
          grep -q arm64 "/tmp/dynamics26-hosted-app-${BUILD_TYPE}-arch.txt"
