name: Alpha.3.5 hosted selection contract

on:
  push:
    branches: [ main ]
    paths:
      - "gui/core/SelectionTypes.h"
      - "gui/core/SelectionPolicy.h"
      - "gui/core/SelectionManager.cpp"
      - "gui/core/SelectionManager.h"
      - "gui/core/ScopeReferenceBuilder.h"
      - "gui/shell/GraphicsWorkspace.cpp"
      - "gui/shell/GraphicsWorkspace.h"
      - "gui/shell/SelectionCoordinator.cpp"
      - "gui/shell/SelectionCoordinator.h"
      - "gui/support/SelectionAcceptanceTest.h"
      - "gui/viewport/GeometrySelectionScene.h"
      - "gui/viewport/GeometryTopologyScene.h"
      - "gui/viewport/GeometryHardwareSelector.h"
      - "gui/viewport/MeshSelectionScene.h"
      - "gui/viewport/MeshHardwareSelector.h"
      - "gui/viewport/ViewportSelectionController.h"
      - "gui/viewport/ViewportSelectionBridge.cpp"
      - "gui/viewport/ViewportSelectionBridge.h"
      - "gui/viewport/ViewportMeshSelectionBridge.cpp"
      - "gui/viewport/ViewportMeshSelectionBridge.h"
      - "tests/gui/test_selection_manager.cpp"
      - "tests/gui/test_scope_reference.cpp"
      - "tests/gui/test_viewport_selection_input.cpp"
      - "tests/gui/test_mesh_selection.cpp"
      - "tests/gui/test_geometry_window_selection.cpp"
      - "tests/gui/test_mesh_viewport_selection.cpp"
      - "gui/CMakeLists.txt"
      - ".github/workflows/macos-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamics26-alpha35-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection-contract:
    name: selection-contract arm64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source and architecture guard
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "arm64"
          git diff --check
          test -f gui/core/ScopeReferenceBuilder.h
          test -f gui/shell/SelectionCoordinator.cpp
          test -f gui/viewport/GeometryTopologyScene.h
          test -f gui/viewport/GeometryHardwareSelector.h
          test -f gui/viewport/MeshSelectionScene.h
          test -f gui/viewport/MeshHardwareSelector.h
          test -f gui/viewport/ViewportSelectionController.h
          test -f gui/viewport/ViewportMeshSelectionBridge.h
          test -f tests/gui/test_scope_reference.cpp
          test -f tests/gui/test_viewport_selection_input.cpp
          test -f tests/gui/test_mesh_selection.cpp
          test -f tests/gui/test_geometry_window_selection.cpp
          test -f tests/gui/test_mesh_viewport_selection.cpp
          grep -q 'SelectionInputActionType::WindowCommit' gui/viewport/ViewportSelectionController.h
          grep -q 'PendingWindowSelectionBatch' gui/shell/SelectionCoordinator.cpp
          grep -q 'manager->apply(batch.items' gui/shell/SelectionCoordinator.cpp

      - name: Install minimal Qt dependency
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: brew install qtbase

      - name: Configure lightweight selection gate
        env:
          FC: gfortran-15
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-selection -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qtbase)" \
            -DFEMCAE_BUILD_TESTING=ON \
            -DFEMCAE_BUILD_GUI=ON \
            -DFEMCAE_GUI_WITH_VTK=OFF \
            -DFEMCAE_ENABLE_OCCT_GEOMETRY=OFF

      - name: Build selection contract tests
        shell: bash
        run: |
          set -euxo pipefail
          # Dependency graph scope + viewport-input + FEM provenance/scope
          # testlerini de build eder. Production GUI burada bilinçli olarak
          # derlenmez; bu hosted gate VTK/OCCT gerektirmeyen state kontratıdır.
          cmake --build build-selection --parallel --target femcae_selection_manager_test

      - name: Selection and scope regression gate
        run: ctest --test-dir build-selection -L selection --output-on-failure

      - name: Native arm64 selection-binary gate
        shell: bash
        run: |
          set -euxo pipefail
          binaries=(
            "build-selection/gui/femcae_selection_manager_test"
            "build-selection/gui/femcae_scope_reference_test"
            "build-selection/gui/femcae_viewport_selection_input_test"
            "build-selection/gui/femcae_mesh_selection_test"
          )
          for binary in "${binaries[@]}"; do
            test -x "$binary"
            file -L "$binary"
            file -L "$binary" | grep -q arm64
          done
