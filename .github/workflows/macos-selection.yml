name: Hosted selection and persistent scope contract

on:
  push:
    branches: [ main ]
    paths:
      - "gui/core/ProjectTypes.h"
      - "gui/core/ProjectModel.cpp"
      - "gui/core/ProjectModel.h"
      - "gui/core/SelectionTypes.h"
      - "gui/core/SelectionPolicy.h"
      - "gui/core/SelectionManager.cpp"
      - "gui/core/SelectionManager.h"
      - "gui/core/ScopeReferenceBuilder.h"
      - "gui/core/ServiceContext.h"
      - "gui/commands/NamedSelectionCommands.h"
      - "gui/services/NamedSelectionService.cpp"
      - "gui/services/NamedSelectionService.h"
      - "gui/shell/Dynamics26MainWindow.cpp"
      - "gui/shell/Dynamics26MainWindow.h"
      - "gui/shell/GraphicsWorkspace.cpp"
      - "gui/shell/GraphicsWorkspace.h"
      - "gui/shell/SelectionCoordinator.cpp"
      - "gui/shell/SelectionCoordinator.h"
      - "gui/support/SelfTest.cpp"
      - "gui/support/SelectionAcceptanceTest.h"
      - "gui/main.cpp"
      - "gui/viewport/GeometrySelectionScene.h"
      - "gui/viewport/GeometryTopologyScene.h"
      - "gui/viewport/GeometryHardwareSelector.h"
      - "gui/viewport/MeshSelectionScene.h"
      - "gui/viewport/MeshHardwareSelector.h"
      - "gui/viewport/ViewportSelectionController.h"
      - "gui/viewport/ViewportSelectionBridge.cpp"
      - "gui/viewport/ViewportSelectionBridge.h"
      - "gui/viewport/ViewportMeshSelectionBridge.cpp"
      - "gui/viewport/ViewportMeshSelectionBridge.h"
      - "tests/gui/test_selection_manager.cpp"
      - "tests/gui/test_scope_reference.cpp"
      - "tests/gui/test_named_selection.cpp"
      - "tests/gui/test_viewport_selection_input.cpp"
      - "tests/gui/test_mesh_selection.cpp"
      - "tests/gui/test_geometry_window_selection.cpp"
      - "tests/gui/test_mesh_viewport_selection.cpp"
      - "gui/CMakeLists.txt"
      - ".github/workflows/macos-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamics26-selection-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection-contract:
    name: selection-scope-contract arm64
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source and architecture guard
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "arm64"
          git diff --check
          test -f gui/core/ScopeReferenceBuilder.h
          test -f gui/commands/NamedSelectionCommands.h
          test -f gui/services/NamedSelectionService.cpp
          test -f gui/services/NamedSelectionService.h
          test -f gui/shell/Dynamics26MainWindow.cpp
          test -f gui/shell/SelectionCoordinator.cpp
          test -f gui/viewport/GeometryTopologyScene.h
          test -f gui/viewport/GeometryHardwareSelector.h
          test -f gui/viewport/MeshSelectionScene.h
          test -f gui/viewport/MeshHardwareSelector.h
          test -f gui/viewport/ViewportSelectionController.h
          test -f gui/viewport/ViewportMeshSelectionBridge.h
          test -f tests/gui/test_scope_reference.cpp
          test -f tests/gui/test_named_selection.cpp
          test -f tests/gui/test_viewport_selection_input.cpp
          test -f tests/gui/test_mesh_selection.cpp
          test -f tests/gui/test_geometry_window_selection.cpp
          test -f tests/gui/test_mesh_viewport_selection.cpp
          grep -q 'femcae_named_selection_test' gui/CMakeLists.txt
          grep -q 'NamedSelectionService \*namedSelections' gui/core/ServiceContext.h
          grep -q 'new NamedSelectionService(project_, geometry_, mesh_, this)' gui/shell/Dynamics26MainWindow.cpp
          grep -q 'services_.namedSelections = namedSelections' gui/shell/Dynamics26MainWindow.cpp
          ! grep -q 'installNamedSelectionService' gui/main.cpp gui/shell/Dynamics26MainWindow.h
          ! grep -q 'createNamedSelectionComposition' gui/main.cpp
          grep -q 'CreateNamedSelectionCommand' gui/commands/NamedSelectionCommands.h
          grep -q 'services.namedSelections != nullptr' gui/support/SelectionAcceptanceTest.h
          grep -q 'SelectionInputActionType::WindowCommit' gui/viewport/ViewportSelectionController.h
          grep -q 'PendingWindowSelectionBatch' gui/shell/SelectionCoordinator.cpp
          grep -q 'manager->apply(batch.items' gui/shell/SelectionCoordinator.cpp

      - name: Install Qt and VTK dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: brew install qt vtk

      - name: Configure hosted selection and application gate
        env:
          FC: gfortran-15
        shell: bash
        run: |
          set -euxo pipefail
          prefix_path="$(brew --prefix qt);$(brew --prefix vtk)"
          cmake -S . -B build-selection -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$prefix_path" \
            -DFEMCAE_BUILD_TESTING=ON \
            -DFEMCAE_BUILD_GUI=ON \
            -DFEMCAE_GUI_WITH_VTK=ON \
            -DFEMCAE_ENABLE_OCCT_GEOMETRY=OFF

      - name: Build selection and persistent scope contract tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-selection --parallel --target femcae_selection_manager_test

      - name: Build application composition with VTK
        shell: bash
        run: |
          set -euxo pipefail
          # Named Selection service wiring, MainWindow persistence/CRUD,
          # context-menu creation and SelectionCoordinator bridge are compiled
          # in the real application target. OCCT is intentionally unnecessary
          # for this selection/persistent-scope gate.
          cmake --build build-selection --parallel --target femcae_gui

      - name: Selection and scope regression gate
        run: ctest --test-dir build-selection -L selection --output-on-failure

      - name: Native arm64 selection-binary gate
        shell: bash
        run: |
          set -euxo pipefail
          binaries=(
            "build-selection/gui/femcae_selection_manager_test"
            "build-selection/gui/femcae_scope_reference_test"
            "build-selection/gui/femcae_named_selection_test"
            "build-selection/gui/femcae_viewport_selection_input_test"
            "build-selection/gui/femcae_mesh_selection_test"
            "build-selection/gui/FEMCAE.app/Contents/MacOS/FEMCAE"
          )
          for binary in "${binaries[@]}"; do
            test -x "$binary"
            file -L "$binary"
            file -L "$binary" | grep -q arm64
          done
