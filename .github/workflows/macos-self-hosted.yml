name: Trusted self-hosted macOS native validation

on:
  push:
    branches: [ main ]
    paths:
      - "gui/**"
      - "tests/gui/**"
      - ".github/workflows/macos-self-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

# Fast push validation and manually requested release validation must not cancel
# each other. They share the trusted Mac but have different verification goals.
concurrency:
  group: dynamics26-self-hosted-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Günlük V1.1 GUI geliştirmesi için trusted Mac üzerindeki hızlı kapı.
  # build-selfhosted-gui-fast dizini bilinçli olarak korunur: dependency ve
  # object-cache tekrar kullanımı self-hosted runner'ın ana hız avantajıdır.
  gui-fast-native:
    if: github.event_name == 'push'
    name: gui-fast on trusted Mac
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    steps:
      - name: Checkout current main without deleting incremental build cache
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Trusted-runner guard and source hygiene
        shell: bash
        run: |
          set -euxo pipefail
          test "$GITHUB_REPOSITORY" = "kavakfatih/Dynamics26"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(uname -m)" = "arm64"
          git diff --check

      - name: V1.1 CAE shell architecture gate
        shell: bash
        run: |
          set -euxo pipefail

          required_sources=(
            "gui/main.cpp"
            "gui/core/ProjectModel.cpp"
            "gui/core/ProjectTreeModel.cpp"
            "gui/core/DocumentCommandManager.cpp"
            "gui/core/DependencyEngine.cpp"
            "gui/core/SelectionManager.cpp"
            "gui/core/SelectionPolicy.h"
            "gui/core/SelectionTypes.h"
            "gui/core/ScopeReferenceBuilder.h"
            "gui/core/AnalysisCapability.cpp"
            "gui/core/AnalysisCapability.h"
            "gui/commands/DomainCommands.cpp"
            "gui/services/GeometryService.cpp"
            "gui/services/MeshService.cpp"
            "gui/services/NamedSelectionService.cpp"
            "gui/services/NamedSelectionService.h"
            "gui/services/MaterialService.cpp"
            "gui/services/AnalysisService.cpp"
            "gui/services/NonlinearHex8SolverBridge.cpp"
            "gui/services/NonlinearHex8SolverBridge.h"
            "include/femcae/meshing/SurfaceLoadAssembler.h"
            "src/meshing/SurfaceLoadAssembler.cpp"
            "include/femcae/application/AnalysisSnapshot.h"
            "include/femcae/application/SolverInputBuilder.h"
            "src/application/AnalysisSnapshot.cpp"
            "src/application/SolverInputBuilder.cpp"
            "src/post/fem_nonlinear_results.f90"
            "src/api/fem_nonlinear_product_api.f90"
            "gui/shell/CommandRegistry.cpp"
            "gui/shell/SelectionCoordinator.cpp"
            "gui/shell/SelectionCoordinator.h"
            "gui/shell/Dynamics26MainWindow.cpp"
            "gui/support/SelectionAcceptanceTest.h"
            "gui/support/BoundarySelectionAuthoringAcceptance.h"
            "gui/support/NonlinearProductWorkflowAcceptance.h"
            "gui/support/SolverWorkspaceAccessibilityAcceptance.h"
            "gui/viewport/ViewportInputRouter.cpp"
            "gui/viewport/ViewportCameraController.cpp"
            "gui/viewport/Dynamics26InteractorStyle.cpp"
            "gui/viewport/GeometrySelectionScene.h"
            "gui/viewport/GeometryTopologyScene.h"
            "gui/viewport/GeometryHardwareSelector.h"
            "gui/viewport/MeshSelectionScene.h"
            "gui/viewport/MeshHardwareSelector.h"
            "gui/viewport/ViewportSelectionController.h"
            "gui/viewport/ViewportSelectionBridge.cpp"
            "gui/viewport/ViewportSelectionBridge.h"
            "gui/viewport/ViewportMeshSelectionBridge.cpp"
            "gui/viewport/ViewportMeshSelectionBridge.h"
            "gui/viewport/ViewportWidget.cpp"
            "tests/gui/test_scope_reference.cpp"
            "tests/gui/test_named_selection.cpp"
            "tests/gui/test_viewport_selection_input.cpp"
            "tests/gui/test_viewport_selection.cpp"
            "tests/gui/test_geometry_window_selection.cpp"
            "tests/gui/test_mesh_selection.cpp"
            "tests/gui/test_mesh_viewport_selection.cpp"
            "tests/gui/test_analysis_capability.cpp"
            "tests/meshing/unit_beta3_surface_load.cpp"
            "tests/application/unit_beta3_analysis_snapshot.cpp"
            "tests/c_api/test_beta3_nonlinear_api.c"
            "tests/c_api/test_beta3_nonlinear_refinement.cpp"
          )
          for source in "${required_sources[@]}"; do
            test -f "$source"
          done

          grep -q 'shell/Dynamics26MainWindow.h' gui/main.cpp
          grep -q 'class DocumentCommandManager;' gui/shell/Dynamics26MainWindow.h
          grep -q 'class DependencyEngine;' gui/shell/Dynamics26MainWindow.h
          grep -q 'SelectionManager.cpp' gui/CMakeLists.txt
          grep -q 'ScopeReferenceBuilder.h' gui/CMakeLists.txt
          grep -q 'NamedSelectionService.cpp' gui/CMakeLists.txt
          grep -q 'femcae_selection_manager_test' gui/CMakeLists.txt
          grep -q 'femcae_analysis_capability_test' gui/CMakeLists.txt
          grep -q 'femcae_scope_reference_test' gui/CMakeLists.txt
          grep -q 'femcae_named_selection_test' gui/CMakeLists.txt
          grep -q 'femcae_viewport_selection_test' gui/CMakeLists.txt
          grep -q 'femcae_geometry_window_selection_test' gui/CMakeLists.txt
          grep -q 'femcae_mesh_selection_test' gui/CMakeLists.txt
          grep -q 'femcae_mesh_viewport_selection_test' gui/CMakeLists.txt
          grep -q 'ViewportInputRouter.cpp' gui/CMakeLists.txt
          grep -q 'ViewportCameraController.cpp' gui/CMakeLists.txt
          grep -q 'Dynamics26InteractorStyle.cpp' gui/CMakeLists.txt
          grep -q 'GeometryTopologyScene.h' gui/CMakeLists.txt
          grep -q 'GeometryHardwareSelector.h' gui/CMakeLists.txt
          grep -q 'MeshSelectionScene.h' gui/CMakeLists.txt
          grep -q 'MeshHardwareSelector.h' gui/CMakeLists.txt
          grep -q 'ViewportSelectionBridge.cpp' gui/CMakeLists.txt
          grep -q 'ViewportMeshSelectionBridge.cpp' gui/CMakeLists.txt
          grep -q 'SelectionCoordinator.cpp' gui/CMakeLists.txt
          grep -q 'DYNAMICS26_GUI_MILESTONE="1.1.0-beta.3"' gui/CMakeLists.txt

          if [[ -e gui/Dynamics26Shell.cpp || -e gui/MainWindow.cpp ]]; then
            echo "Legacy corrective GUI shell source reintroduced." >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'setUnifiedTitleAndToolBarOnMac(true)' gui; then
            echo "Unsupported unified title/toolbar path reintroduced for the OpenGL window." >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'Qt::META' gui; then
            echo "macOS Command shortcuts must use Qt::CTRL semantic mapping." >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'setStyleSheet(' gui; then
            echo "Application GUI must not reintroduce hand-authored QSS styling." >&2
            exit 1
          fi
          if grep -R --line-number -E 'qApp->setPalette|QApplication::setPalette' gui; then
            echo "Application-wide palette overrides are not allowed; System Appearance is authoritative." >&2
            exit 1
          fi

      - name: Reuse or install native GUI dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euxo pipefail
          if command -v brew >/dev/null 2>&1; then
            BREW_BIN="$(command -v brew)"
          elif [[ -x /opt/homebrew/bin/brew ]]; then
            BREW_BIN=/opt/homebrew/bin/brew
          else
            echo "Homebrew bulunamadi. Self-hosted runner Mac'te Homebrew kurulu olmali." >&2
            exit 1
          fi

          eval "$("$BREW_BIN" shellenv)"
          echo "$(dirname "$BREW_BIN")" >> "$GITHUB_PATH"

          # Fast gate yalnız Qt Core/Gui/Widgets/OpenGLWidgets kullanır. `qt`
          # meta-formülü webengine vb. gereksiz modülleri getirir; qtbase yeterlidir.
          for formula in cmake ninja gcc qtbase vtk arpack opencascade; do
            if ! "$BREW_BIN" list --versions "$formula" >/dev/null 2>&1; then
              "$BREW_BIN" install "$formula"
            fi
          done

          FC_PATH="$(command -v gfortran || true)"
          if [[ -z "$FC_PATH" ]]; then
            for candidate in /opt/homebrew/bin/gfortran-* /usr/local/bin/gfortran-*; do
              if [[ -x "$candidate" ]]; then
                FC_PATH="$candidate"
              fi
            done
          fi
          test -n "$FC_PATH"
          test -x "$FC_PATH"

          echo "FC=$FC_PATH" >> "$GITHUB_ENV"
          echo "QT_PREFIX=$("$BREW_BIN" --prefix qtbase)" >> "$GITHUB_ENV"
          echo "VTK_PREFIX=$("$BREW_BIN" --prefix vtk)" >> "$GITHUB_ENV"
          echo "OCCT_PREFIX=$("$BREW_BIN" --prefix opencascade)" >> "$GITHUB_ENV"

      - name: Configure incremental Release GUI gate
        shell: bash
        run: |
          set -euxo pipefail
          prefix_path="$QT_PREFIX;$VTK_PREFIX;$OCCT_PREFIX"
          cmake -S . -B build-selfhosted-gui-fast -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$prefix_path" \
            -DFEMCAE_BUILD_TESTING=ON \
            -DFEMCAE_BUILD_GUI=ON \
            -DFEMCAE_GUI_WITH_VTK=ON \
            -DFEMCAE_ENABLE_OCCT_GEOMETRY=ON \
            -DFEMCAE_REQUIRE_OCCT=ON

      - name: Build GUI and V1.1 GUI tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-selfhosted-gui-fast --parallel --target femcae_gui
          cmake --build build-selfhosted-gui-fast --parallel --target femcae_project_migration_test
          cmake --build build-selfhosted-gui-fast --parallel --target femcae_selection_manager_test
          cmake --build build-selfhosted-gui-fast --parallel --target femcae_viewport_navigation_test
          cmake --build build-selfhosted-gui-fast --parallel --target femcae_analysis_capability_test
          cmake --build build-selfhosted-gui-fast --parallel --target unit_beta3_surface_load
          cmake --build build-selfhosted-gui-fast --parallel --target unit_beta3_analysis_snapshot
          cmake --build build-selfhosted-gui-fast --parallel --target c_api_beta3_nonlinear
          cmake --build build-selfhosted-gui-fast --parallel --target c_api_beta3_nonlinear_refinement

      - name: Project migration gate
        run: ctest --test-dir build-selfhosted-gui-fast -L migration --output-on-failure

      - name: Typed capability resolver gate
        run: ctest --test-dir build-selfhosted-gui-fast -R '^gui.analysis_capability$' --output-on-failure

      - name: Consistent Total Force surface integration gate
        run: ctest --test-dir build-selfhosted-gui-fast -R '^unit_beta3_surface_load$' --output-on-failure

      - name: Immutable AnalysisSnapshot and SolverInputBuilder gate
        run: ctest --test-dir build-selfhosted-gui-fast -R '^unit_beta3_analysis_snapshot$' --output-on-failure

      - name: General nonlinear HEX8 product ABI gate
        run: ctest --test-dir build-selfhosted-gui-fast -R '^c_api_beta3_nonlinear(_refinement)?$' --output-on-failure

      - name: Selection state and VTK picker gate
        run: ctest --test-dir build-selfhosted-gui-fast -L selection --output-on-failure

      - name: Selection Coordinator shell acceptance
        env:
          QT_QPA_PLATFORM: offscreen
        run: build-selfhosted-gui-fast/gui/FEMCAE.app/Contents/MacOS/FEMCAE --selection-selftest

      - name: Viewport navigation gate
        run: ctest --test-dir build-selfhosted-gui-fast -L navigation --output-on-failure

      - name: Native arm64 GUI architecture gate
        shell: bash
        run: |
          set -euxo pipefail
          app="build-selfhosted-gui-fast/gui/FEMCAE.app/Contents/MacOS/FEMCAE"
          test -x "$app"
          file -L "$app" | tee /tmp/dynamics26-selfhosted-gui-arch.txt
          grep -q arm64 /tmp/dynamics26-selfhosted-gui-arch.txt

      - name: Package engineering preview
        if: contains(github.event.head_commit.message, '[preview]')
        shell: bash
        run: |
          set -euxo pipefail
          source_app="$PWD/build-selfhosted-gui-fast/gui/FEMCAE.app"
          preview_app="$RUNNER_TEMP/Dynamics26.app"
          archive="$RUNNER_TEMP/Dynamics26-1.1.0-beta.3-engineering-preview-macos-arm64.zip"
          notice="$RUNNER_TEMP/Dynamics26-engineering-preview-NOT-STANDALONE.txt"

          test -x "$source_app/Contents/MacOS/FEMCAE"
          "$source_app/Contents/MacOS/FEMCAE" --bundle-smoke

          rm -rf "$preview_app"
          rm -f "$archive" "$archive.sha256" "$notice"
          ditto "$source_app" "$preview_app"
          ditto -c -k --sequesterRsrc --keepParent "$preview_app" "$archive"
          shasum -a 256 "$archive" | tee "$archive.sha256"
          cat > "$notice" <<'EOF'
          Dynamics26 V1.1.0-beta.2 engineering acceptance preview

          This is an engineering/UX preview built on the trusted Apple Silicon Mac.
          Automated Beta.2 Solver Workspace, convergence/diagnostics, integrated
          modeling, actionable Preflight, structured diagnostics, Solve/Results
          lifecycle and inherited Named Selection scope gates have passed before
          packaging. Physical keyboard/mouse/trackpad acceptance is intentionally
          separate from automated CI. The preview reuses Homebrew Qt/VTK/OCCT
          runtime dependencies and is NOT the standalone release bundle. The manual
          native-release/full bundle audit remains mandatory before a distributable
          build can be called verified.
          EOF

      - name: Upload engineering preview
        if: contains(github.event.head_commit.message, '[preview]')
        uses: actions/upload-artifact@v4
        with:
          name: Dynamics26-1.1.0-beta.3-engineering-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Dynamics26-1.1.0-beta.3-engineering-preview-macos-arm64.zip
            ${{ runner.temp }}/Dynamics26-1.1.0-beta.3-engineering-preview-macos-arm64.zip.sha256
            ${{ runner.temp }}/Dynamics26-engineering-preview-NOT-STANDALONE.txt
          if-no-files-found: error
          retention-days: 3

  # Clean/full standalone validation remains explicit and manual. This job does
  # not reuse the incremental fast-gate build and keeps strict bundle auditing.
  native-release:
    if: github.event_name == 'workflow_dispatch'
    name: native-release on trusted Mac
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Trusted-runner guard and host information
        shell: bash
        run: |
          set -euxo pipefail
          test "$GITHUB_REPOSITORY" = "kavakfatih/Dynamics26"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(uname -m)" = "arm64"
          sw_vers
          uname -a

      - name: Prepare Homebrew and native dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euxo pipefail
          if command -v brew >/dev/null 2>&1; then
            BREW_BIN="$(command -v brew)"
          elif [[ -x /opt/homebrew/bin/brew ]]; then
            BREW_BIN=/opt/homebrew/bin/brew
          else
            echo "Homebrew bulunamadi. Self-hosted runner Mac'te Homebrew kurulu olmali." >&2
            exit 1
          fi

          eval "$("$BREW_BIN" shellenv)"
          echo "$(dirname "$BREW_BIN")" >> "$GITHUB_PATH"

          for formula in cmake ninja gcc qt vtk arpack opencascade; do
            if ! "$BREW_BIN" list --versions "$formula" >/dev/null 2>&1; then
              "$BREW_BIN" install "$formula"
            fi
          done

          FC_PATH="$(command -v gfortran || true)"
          if [[ -z "$FC_PATH" ]]; then
            for candidate in /opt/homebrew/bin/gfortran-* /usr/local/bin/gfortran-*; do
              if [[ -x "$candidate" ]]; then
                FC_PATH="$candidate"
              fi
            done
          fi
          test -n "$FC_PATH"
          test -x "$FC_PATH"

          echo "FC=$FC_PATH" >> "$GITHUB_ENV"
          echo "QT_PREFIX=$("$BREW_BIN" --prefix qt)" >> "$GITHUB_ENV"
          echo "VTK_PREFIX=$("$BREW_BIN" --prefix vtk)" >> "$GITHUB_ENV"
          echo "OCCT_PREFIX=$("$BREW_BIN" --prefix opencascade)" >> "$GITHUB_ENV"

      - name: Configure Release GUI and solver
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build-selfhosted stage-selfhosted
          prefix_path="$QT_PREFIX;$VTK_PREFIX;$OCCT_PREFIX"
          cmake -S . -B build-selfhosted -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$prefix_path" \
            -DFEMCAE_BUILD_TESTING=ON \
            -DFEMCAE_ENABLE_RUNTIME_CHECKS=ON \
            -DFEMCAE_BUILD_GUI=ON \
            -DFEMCAE_GUI_WITH_VTK=ON \
            -DFEMCAE_ENABLE_OCCT_GEOMETRY=ON \
            -DFEMCAE_REQUIRE_OCCT=ON

      - name: Build Release GUI and solver
        run: cmake --build build-selfhosted --parallel

      - name: Full native verification matrix
        run: ctest --test-dir build-selfhosted --output-on-failure

      - name: Critical native gates
        shell: bash
        run: |
          set -euxo pipefail
          for label in migration selection viewport navigation camera occt meshing nonlinear contact release performance; do
            ctest --test-dir build-selfhosted -L "$label" --output-on-failure
          done

      - name: Native arm64 architecture gate
        shell: bash
        run: |
          set -euxo pipefail
          for binary in build-selfhosted/femcae_cli build-selfhosted/libfemcae.dylib build-selfhosted/gui/FEMCAE.app/Contents/MacOS/FEMCAE; do
            test -e "$binary"
            file -L "$binary" | grep -q arm64
          done

      - name: Install and deploy standalone app
        shell: bash
        run: |
          set -euxo pipefail
          cmake --install build-selfhosted --prefix "$PWD/stage-selfhosted"
          app="$PWD/stage-selfhosted/FEMCAE.app"
          test -x "$app/Contents/MacOS/FEMCAE"
          test -d "$app/Contents/Frameworks"

      - name: Ad-hoc sign, loader smoke and bundle audit
        shell: bash
        run: |
          set -euxo pipefail
          app="$PWD/stage-selfhosted/FEMCAE.app"
          codesign --force --deep --sign - --options runtime "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/FEMCAE" --bundle-smoke
          ./scripts/macos/audit_bundle.sh "$app"

      - name: Package verified self-hosted app
        shell: bash
        run: |
          set -euxo pipefail
          app="$PWD/stage-selfhosted/FEMCAE.app"
          archive="$RUNNER_TEMP/Dynamics26-1.0.2-macos-arm64-selfhosted-adhoc.zip"
          rm -f "$archive" "$archive.sha256"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" | tee "$archive.sha256"

      - name: Upload verified self-hosted app
        uses: actions/upload-artifact@v4
        with:
          name: Dynamics26-1.0.2-macos-arm64-selfhosted-adhoc
          path: |
            ${{ runner.temp }}/Dynamics26-1.0.2-macos-arm64-selfhosted-adhoc.zip
            ${{ runner.temp }}/Dynamics26-1.0.2-macos-arm64-selfhosted-adhoc.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup self-hosted workspace artifacts
        if: always()
        shell: bash
        run: rm -rf build-selfhosted stage-selfhosted
