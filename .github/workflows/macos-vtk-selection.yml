name: CAD + FEM topology selection verification

on:
  push:
    branches: [ main ]
    paths:
      - "include/femcae/geometry/GeometryTypes.h"
      - "include/femcae/geometry/OcctStepImporter.h"
      - "include/femcae/meshing/MeshTypes.h"
      - "include/femcae/meshing/StructuredHexMesher.h"
      - "src/geometry/OcctStepImporter.cpp"
      - "src/meshing/StructuredHexMesher.cpp"
      - "tests/geometry/unit_v120_occt_adapter.cpp"
      - "tests/geometry/ver_v120_004_occt_step_box.cpp"
      - "gui/CMakeLists.txt"
      - "gui/main.cpp"
      - "gui/core/DependencyEngine.cpp"
      - "gui/core/DependencyEngine.h"
      - "gui/core/SelectionTypes.h"
      - "gui/core/SelectionPolicy.h"
      - "gui/core/SelectionManager.cpp"
      - "gui/core/SelectionManager.h"
      - "gui/core/ScopeReferenceBuilder.h"
      - "gui/services/AnalysisService.cpp"
      - "gui/services/AnalysisService.h"
      - "gui/services/AnalysisBoundaryScope.cpp"
      - "gui/services/GeometryService.cpp"
      - "gui/services/GeometryService.h"
      - "gui/services/MeshService.cpp"
      - "gui/services/MeshService.h"
      - "gui/services/NamedSelectionService.cpp"
      - "gui/services/NamedSelectionService.h"
      - "gui/details/BoundaryConditionDetails.cpp"
      - "gui/details/BoundaryConditionDetails.h"
      - "gui/shell/DetailsHost.cpp"
      - "gui/shell/GraphicsWorkspace.cpp"
      - "gui/shell/GraphicsWorkspace.h"
      - "gui/shell/SelectionCoordinator.cpp"
      - "gui/shell/SelectionCoordinator.h"
      - "gui/support/BoundaryConsumerAcceptance.h"
      - "gui/support/BoundarySelectionAuthoringAcceptance.h"
      - "gui/support/SelectionAcceptanceTest.h"
      - "gui/viewport/GeometrySelectionScene.h"
      - "gui/viewport/GeometryTopologyScene.h"
      - "gui/viewport/MeshSelectionScene.h"
      - "gui/viewport/RenderRoles.cpp"
      - "gui/viewport/RenderRoles.h"
      - "gui/viewport/ViewportSelectionBridge.cpp"
      - "gui/viewport/ViewportSelectionBridge.h"
      - "gui/viewport/ViewportMeshSelectionBridge.cpp"
      - "gui/viewport/ViewportMeshSelectionBridge.h"
      - "gui/viewport/ViewportSelectionController.h"
      - "gui/viewport/ViewportWidget.cpp"
      - "gui/viewport/ViewportWidget.h"
      - "tests/gui/test_selection_manager.cpp"
      - "tests/gui/test_scope_reference.cpp"
      - "tests/gui/test_named_selection.cpp"
      - "tests/gui/test_viewport_selection_input.cpp"
      - "tests/gui/test_mesh_selection.cpp"
      - "tests/gui/test_mesh_viewport_selection.cpp"
      - "tests/gui/test_viewport_selection.cpp"
      - "tests/gui/test_topology_selection.cpp"
      - ".github/workflows/macos-vtk-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamics26-topology-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology-selection:
    name: OCCT + VTK topology selection arm64
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source and architecture guard
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "arm64"
          git diff --check
          test -f tests/geometry/ver_v120_004_occt_step_box.cpp
          test -f tests/gui/test_viewport_selection.cpp
          test -f tests/gui/test_mesh_selection.cpp
          test -f tests/gui/test_mesh_viewport_selection.cpp
          test -f tests/gui/test_named_selection.cpp
          test -f gui/services/AnalysisBoundaryScope.cpp
          test -f gui/services/NamedSelectionService.cpp
          test -f gui/services/NamedSelectionService.h
          test -f gui/support/BoundaryConsumerAcceptance.h
          test -f gui/support/BoundarySelectionAuthoringAcceptance.h
          test -f gui/viewport/GeometrySelectionScene.h
          test -f gui/viewport/MeshSelectionScene.h
          test -f gui/viewport/ViewportMeshSelectionBridge.cpp
          test -f gui/support/SelectionAcceptanceTest.h
          grep -q 'femcae_named_selection_test' gui/CMakeLists.txt
          grep -q 'boundaryScopeSignature' gui/services/AnalysisService.cpp
          grep -q 'resolvedBoundaryNodeIds' gui/services/AnalysisService.cpp

      - name: Install Qt VTK and OCCT dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: brew install qtbase vtk opencascade

      - name: Configure topology selection gate
        env:
          FC: gfortran-15
        shell: bash
        run: |
          set -euxo pipefail
          prefix_path="$(brew --prefix qtbase);$(brew --prefix vtk);$(brew --prefix opencascade)"
          cmake -S . -B build-topology-selection -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$prefix_path" \
            -DFEMCAE_BUILD_TESTING=ON \
            -DFEMCAE_BUILD_GUI=ON \
            -DFEMCAE_GUI_WITH_VTK=ON \
            -DFEMCAE_ENABLE_OCCT_GEOMETRY=ON \
            -DFEMCAE_REQUIRE_OCCT=ON

      - name: Build canonical CAD topology verification
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-topology-selection --parallel --target ver_v120_004
          fixture="$RUNNER_TEMP/dynamics26-named-boundary-box.step"
          DYNAMICS26_STEP_FIXTURE_OUTPUT="$fixture" \
            ctest --test-dir build-topology-selection -R '^ver_v120_004$' --output-on-failure
          test -s "$fixture"
          echo "DYNAMICS26_STEP_FIXTURE=$fixture" >> "$GITHUB_ENV"

      - name: Build CAD and FEM selection contract matrix
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-topology-selection --parallel --target femcae_selection_manager_test
          ctest --test-dir build-topology-selection -L selection --output-on-failure

      - name: Native arm64 topology binaries gate
        shell: bash
        run: |
          set -euxo pipefail
          for binary in \
            build-topology-selection/tests/ver_v120_004 \
            build-topology-selection/gui/femcae_named_selection_test \
            build-topology-selection/gui/femcae_viewport_selection_test \
            build-topology-selection/gui/femcae_mesh_selection_test \
            build-topology-selection/gui/femcae_mesh_viewport_selection_test; do
            test -x "$binary"
            file -L "$binary" | grep -q arm64
          done

      - name: Build application shell
        run: cmake --build build-topology-selection --parallel --target femcae_gui

      - name: Selection and named boundary consumer shell acceptance
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euxo pipefail
          app="build-topology-selection/gui/FEMCAE.app/Contents/MacOS/FEMCAE"
          test -x "$app"
          test -s "$DYNAMICS26_STEP_FIXTURE"
          "$app" --import-step "$DYNAMICS26_STEP_FIXTURE" --selection-selftest

      - name: Native arm64 GUI composition gate
        shell: bash
        run: |
          set -euxo pipefail
          app="build-topology-selection/gui/FEMCAE.app/Contents/MacOS/FEMCAE"
          file -L "$app" | tee /tmp/dynamics26-topology-shell-arch.txt
          grep -q arm64 /tmp/dynamics26-topology-shell-arch.txt
