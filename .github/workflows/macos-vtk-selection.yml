name: Alpha.3.2 hosted VTK selection verification

on:
  push:
    branches: [ main ]
    paths:
      - "gui/CMakeLists.txt"
      - "gui/main.cpp"
      - "gui/core/SelectionTypes.h"
      - "gui/core/SelectionPolicy.h"
      - "gui/core/SelectionManager.cpp"
      - "gui/core/SelectionManager.h"
      - "gui/shell/DetailsHost.cpp"
      - "gui/shell/SelectionCoordinator.cpp"
      - "gui/shell/SelectionCoordinator.h"
      - "gui/support/SelectionAcceptanceTest.h"
      - "gui/viewport/GeometrySelectionScene.h"
      - "gui/viewport/RenderRoles.cpp"
      - "gui/viewport/RenderRoles.h"
      - "gui/viewport/ViewportSelectionController.h"
      - "tests/gui/test_selection_manager.cpp"
      - "tests/gui/test_scope_reference.cpp"
      - "tests/gui/test_viewport_selection_input.cpp"
      - "tests/gui/test_viewport_selection.cpp"
      - ".github/workflows/macos-vtk-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamics26-alpha32-vtk-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vtk-selection:
    name: VTK Body/Face picker + shell contract arm64
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source and architecture guard
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "arm64"
          git diff --check
          test -f tests/gui/test_viewport_selection.cpp
          test -f gui/viewport/GeometrySelectionScene.h
          test -f gui/support/SelectionAcceptanceTest.h

      - name: Install Qt and VTK dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: brew install qtbase vtk

      - name: Configure VTK selection gate
        env:
          FC: gfortran-15
        shell: bash
        run: |
          set -euxo pipefail
          prefix_path="$(brew --prefix qtbase);$(brew --prefix vtk)"
          cmake -S . -B build-vtk-selection -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$prefix_path" \
            -DFEMCAE_BUILD_TESTING=ON \
            -DFEMCAE_BUILD_GUI=ON \
            -DFEMCAE_GUI_WITH_VTK=ON \
            -DFEMCAE_ENABLE_OCCT_GEOMETRY=OFF

      - name: Build Alpha.3.2 selection tests
        shell: bash
        run: |
          set -euxo pipefail
          # VTK-enabled CMake graph makes the core selection target depend on
          # the real offscreen vtkCellPicker provenance regression binary.
          cmake --build build-vtk-selection --parallel --target femcae_selection_manager_test

      - name: Run selection contract matrix
        run: ctest --test-dir build-vtk-selection -L selection --output-on-failure

      - name: Native arm64 picker-binary gate
        shell: bash
        run: |
          set -euxo pipefail
          binary="build-vtk-selection/gui/femcae_viewport_selection_test"
          test -x "$binary"
          file -L "$binary" | tee /tmp/dynamics26-alpha32-vtk-selection-arch.txt
          grep -q arm64 /tmp/dynamics26-alpha32-vtk-selection-arch.txt

      - name: Build application shell
        run: cmake --build build-vtk-selection --parallel --target femcae_gui

      - name: Selection Coordinator shell acceptance
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euxo pipefail
          app="build-vtk-selection/gui/FEMCAE.app/Contents/MacOS/FEMCAE"
          test -x "$app"
          "$app" --selection-selftest

      - name: Native arm64 GUI composition gate
        shell: bash
        run: |
          set -euxo pipefail
          app="build-vtk-selection/gui/FEMCAE.app/Contents/MacOS/FEMCAE"
          file -L "$app" | tee /tmp/dynamics26-alpha32-shell-arch.txt
          grep -q arm64 /tmp/dynamics26-alpha32-shell-arch.txt
