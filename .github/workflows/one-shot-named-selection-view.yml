name: One-shot named selection persistent view patch

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-named-selection-view.yml

permissions:
  contents: write

jobs:
  patch-persistent-view:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact persistent scope view patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from base64 import b64decode
          from pathlib import Path

          def replace_b64(path, old_b64, new_b64, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              old = b64decode(old_b64).decode('utf-8')
              new = b64decode(new_b64).decode('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_b64('gui/shell/SelectionCoordinator.cpp',
              '',
              '',
              'persistent view preamble')

          replace_b64('gui/shell/SelectionCoordinator.cpp',
              '',
              '',
              'persistent geometry overlay')

          replace_b64('gui/shell/SelectionCoordinator.cpp',
              '',
              '',
              'persistent mesh overlay')

          replace_b64('gui/support/SelectionAcceptanceTest.h',
              '',
              '',
              'normal persistent view acceptance')

          replace_b64('gui/support/SelectionAcceptanceTest.h',
              '',
              '',
              'stale persistent view acceptance')
          PY

          git diff --check
          grep -q 'persistentDefinition' gui/shell/SelectionCoordinator.cpp
          grep -q 'normal persistent Named Selection overlay does not masquerade' gui/support/SelectionAcceptanceTest.h

      - name: Commit exact patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-named-selection-view.yml
          git config user.name "Dynamics26 CI"
          git config user.email "actions@users.noreply.github.com"
          git add gui/shell/SelectionCoordinator.cpp gui/support/SelectionAcceptanceTest.h .github/workflows/one-shot-named-selection-view.yml
          git diff --cached --check
          git commit -m "feat: show persistent named selection scope"
          git push origin HEAD:main
